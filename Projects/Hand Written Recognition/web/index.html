<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App Loader</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0f0f0f;
  color: white;
}

/* Loader */
.loader {
  position: fixed;
  inset: 0;
  background: #0f0f0f;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity 0.4s ease;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #2a2a2a;
  border-top: 4px solid #00ff88;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.hidden {
  opacity: 0;
  pointer-events: none;
}

.content {
  display: none;
  padding: 60px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
</style>
</head>
<body>

<div id="loader" class="loader">
  <div class="spinner"></div>
  <p style="margin-top:15px;">Waking up server...</p>
</div>

<div id="content" class="content">
  <h1>Backend Ready 🚀</h1>
</div>

<script>
const BACKEND_URL = "https://ml-8q8k.onrender.com/health";
const MAX_WAIT_TIME = 20000; // 60 sec safety timeout
const RETRY_DELAY = 2000;

async function waitForBackend() {
  const startTime = Date.now();

  while (Date.now() - startTime < MAX_WAIT_TIME) {
    try {
      const response = await fetch(BACKEND_URL, { cache: "no-store" });
      if (response.ok) {
        showContent();
        setTimeout(()=>{window.location.href= "home.html"},1000)
        return;
      }
    } catch (_) {}

    await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
  }

  document.querySelector("#loader p").textContent =
    "Server is taking longer than expected...";
}

function showContent() {
  document.getElementById("loader").classList.add("hidden");

  setTimeout(() => {
    document.getElementById("loader").style.display = "none";
    document.getElementById("content").style.display = "block";
  }, 400);
}

waitForBackend();
</script>

</body>
</html>
