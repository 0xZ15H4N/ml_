<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handwritten Digit Recognizer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: black;
        font-family: Arial, sans-serif;
        text-align: center;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-bottom: 24px;
        background-image: url("./wow.gif");
        background-size: cover;
      }

      h2 {
        color: white;
        margin-top: 20px;
        margin-bottom: 8px;
        font-size: clamp(1.1rem, 5vw, 1.6rem);
        padding: 0 12px;
      }

      #status {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin: 8px 0;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 4px solid transparent;
        border-top: 4px solid red;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #message {
        color: red;
        font-size: clamp(10px, 3vw, 13px);
        letter-spacing: 1px;
      }

      #main-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
      }

      #canvas-container {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      canvas {
        border: 2px solid #333;
        image-rendering: pixelated;
        max-width: 96vw;
        touch-action: none;
        cursor: crosshair;
      }

      #controls {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 16px;
      }

      button {
        background: #3517c8;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: clamp(8px, 2.5vw, 12px) clamp(14px, 4vw, 20px);
        font-size: clamp(12px, 3.5vw, 15px);
        font-weight: bold;
        cursor: pointer;
        min-width: 80px;
      }

      button:hover {
        opacity: 0.9;
      }

      #Result-cnn {
        width: clamp(60px, 18vw, 90px);
        height: clamp(60px, 18vw, 90px);
        border: 2px solid white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: bold;
        color: red;
      }
      #Result-ml {
        width: clamp(60px, 18vw, 90px);
        height: clamp(60px, 18vw, 90px);
        border: 2px solid white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: bold;
        color: red;
      }

      #hint {
        color: #888;
        font-size: clamp(10px, 2.8vw, 12px);
      }
    </style>
  </head>
  <body>
    <h2>Handwritten Digit Recognizer</h2>

    <div id="status">
      <div class="spinner"></div>
      <div id="message">WAITING FOR BACKEND (10-15s)</div>
    </div>

    <div id="main-container">
      <div id="canvas-container">
        <canvas id="grid-canvas"></canvas>
      </div>
      <div id="controls">
        <button onclick="submitResult()">Submit</button>
        <!-- <div id="Result-cnn">CNN prediction ?</div> -->
        <div id="Result-ml">ML prediction ?</div>
        <button onclick="clearGrid()">Clear</button>
      </div>
      <p id="hint">Draw a digit (0-9) and press Submit</p>
    </div>

    <script>
      const ROWS = 28;
      const COLS = 28;
      const BACKEND_URL = "https://ml-8q8k.onrender.com";

      const canvas = document.getElementById("grid-canvas");
      const ctx = canvas.getContext("2d");
      const grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));

      function computeCellSize() {
        const maxW = Math.floor((window.innerWidth * 0.92) / COLS);
        const maxH = Math.floor((window.innerHeight * 0.62) / ROWS);
        return Math.max(8, Math.min(maxW, maxH, 20));
      }

      let cellSize = computeCellSize();

      function resizeCanvas() {
        cellSize = computeCellSize();
        canvas.width = COLS * cellSize;
        canvas.height = ROWS * cellSize;
        drawGrid();
      }

      function drawGrid() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < ROWS; i++) {
          for (let j = 0; j < COLS; j++) {
            const v = grid[i][j];
            ctx.fillStyle = `rgb(${v},${v},${v})`;
            ctx.fillRect(j * cellSize, i * cellSize, cellSize, cellSize);
            ctx.strokeStyle = "#282828";
            ctx.lineWidth = 0.5;
            ctx.strokeRect(j * cellSize, i * cellSize, cellSize, cellSize);
          }
        }
      }

      function applyBrush(row, col) {
        for (let i = -1; i <= 1; i++) {
          for (let j = -1; j <= 1; j++) {
            const r = row + i,
              c = col + j;
            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
              grid[r][c] += 60 - (Math.abs(i) + Math.abs(j)) * 20;
              grid[r][c] = Math.min(255, Math.max(0, grid[r][c]));
            }
          }
        }
      }

      function getCanvasPos(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height),
        };
      }

      function paintAt(clientX, clientY) {
        const { x, y } = getCanvasPos(clientX, clientY);
        const col = Math.floor(x / cellSize);
        const row = Math.floor(y / cellSize);
        if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
          applyBrush(row, col);
          drawGrid();
        }
      }

      let isDrawing = false;

      canvas.addEventListener("mousedown", (e) => {
        if (e.button !== 2) {
          isDrawing = true;
          paintAt(e.clientX, e.clientY);
        }
      });
      canvas.addEventListener("mousemove", (e) => {
        if (isDrawing) paintAt(e.clientX, e.clientY);
      });
      canvas.addEventListener("mouseup", () => (isDrawing = false));
      canvas.addEventListener("mouseleave", () => (isDrawing = false));
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      canvas.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          isDrawing = true;
          paintAt(e.touches[0].clientX, e.touches[0].clientY);
        },
        { passive: false },
      );
      canvas.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          if (isDrawing) paintAt(e.touches[0].clientX, e.touches[0].clientY);
        },
        { passive: false },
      );
      canvas.addEventListener("touchend", () => (isDrawing = false));

      function clearGrid() {
        for (let i = 0; i < ROWS; i++)
          for (let j = 0; j < COLS; j++) grid[i][j] = 0;
        // document.getElementById("Result-cnn").innerText = "CNN prediction ?";
        document.getElementById("Result-ml").innerText = "ML prediction ?";
        drawGrid();
      }

      function getLabeledInput() {
        const obj = {};
        let index = 0;
        for (let i = 0; i < ROWS; i++)
          for (let j = 0; j < COLS; j++)
            obj[`pixel_${index++}`] = grid[i][j] / 255;
        return obj;
      }

      async function submitResult() {
        const btn = document.querySelector("button");
        btn.disabled = true;
        btn.textContent = "...";
        try {
          const response_ml = await fetch(`${BACKEND_URL}/guess-ml`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(getLabeledInput()),
          });
          const data_ml = await response_ml.json();
          // const response_cnn = await fetch(`${BACKEND_URL}/guess-cnn`,{
          //   method:"POST",
          //   headers:{"Content-Type":"application/json"},
          //   body: JSON.stringify(getLabeledInput())
          // })
          // const data_cnn = await response_cnn.json();
          // console.log(data_cnn,data_ml,"hello world")
          // document.getElementById("Result-cnn").innerText = data_cnn.prediction_cnn;
          document.getElementById("Result-ml").innerText = data_ml.prediction_ml;
        } catch(error){
          console.error(error)
          document.getElementById("Result-ml").innerText = "!";
          // document.getElementById("Result-cnn").innerText = "!";
        } finally {
          btn.disabled = false;
          btn.textContent = "Submit";
        }
      }

      async function waitForBackend() {
        while (true) {
          try {
            const res = await fetch(`${BACKEND_URL}/health`, {
              cache: "no-store",
              signal: AbortSignal.timeout(2000),
            });
            if (res.ok) {
              const msg = document.getElementById("message");
              const spinner = document.querySelector(".spinner");
              msg.style.color = "#00ff88";
              msg.innerText = "BACKEND : LIVE";
              spinner.style.border = "4px solid #00ff88";
              spinner.style.borderTop = "4px solid #00ff88";
              spinner.style.animation = "none";
              return;
            }
          } catch {}
          await new Promise((r) => setTimeout(r, 2000));
        }
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
      waitForBackend();
    </script>
  </body>
</html>
